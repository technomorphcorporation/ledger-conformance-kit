org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true

# Off on the 8.x line: cyclonedx and signing are not fully configuration-cache
# compatible here and the failure mode is opaque. Revisit on 9.x.
org.gradle.configuration-cache=false

# The development version: what local and CI builds produce between releases.
#
# A release does not read this. The tag is the single source of truth for a published version
# — v1.0.0 builds 1.0.0 via -Pversion — so there is nothing here to keep in step with a tag,
# and nothing to forget to update before one. What this must do is sit ABOVE the last release,
# or a jar built from current code sorts below code it already contains.
#
# Bump it after tagging, to the lowest plausible next version. Raise it to a MINOR when a
# feature actually lands: a new invariant in a MINOR can turn a client's build red, so that
# should be a decision rather than a default.
version=1.1.0-SNAPSHOT

# Default seed for the conformance suite.
# Override for a soak run: ./gradlew check -Plck.seed=8823714
lck.seed=42
