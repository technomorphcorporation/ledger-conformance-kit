# Gradle 8.5 — pinned deliberately. 8.5 is the release in which Gradle gained full
# support for compiling, testing and running on Java 21.
#
# Bumping is a one-line change here plus `./gradlew wrapper`. If you move to 9.x, the
# junit-platform-launcher dependency in build.gradle.kts is already declared, so the
# only other decision is whether to enable the configuration cache.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
