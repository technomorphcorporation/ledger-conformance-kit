# Gradle 8.5 — pinned deliberately. 8.5 is the release in which Gradle gained full
# support for compiling, testing and running on Java 21.
#
# Bumping is a one-line change here plus `./gradlew wrapper`. If you move to 9.x, the
# junit-platform-launcher dependency in build.gradle.kts is already declared, so the
# only other decision is whether to enable the configuration cache.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
# Published checksum for the distribution above, from services.gradle.org. Without it,
# validateDistributionUrl only checks the URL is well-formed — it does not verify what
# arrives. Re-fetch the matching .sha256 when bumping the version.
distributionSha256Sum=9d926787066a081739e8200858338b4a69e837c3a821a33aca9db09dd4a41026
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
