# The gate. COMPLIANCE.md says `./gradlew verify` runs on every change; this is what makes
# that a property of the repository rather than a habit of whoever last touched it.
#
# Third-party actions are pinned to commit SHAs, not tags. A tag is mutable: `@v4` is whatever
# its owner last pointed it at, which is a supply-chain claim this project is in no position to
# make about someone else's repository while asking clients to review its own. The version each
# SHA corresponded to is noted beside it so upgrades stay legible.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4
        with:
          distribution: temurin
          java-version: '21'

      # Verifies gradle-wrapper.jar against the checksums Gradle publishes, so a jar swapped in
      # a pull request cannot execute in CI. The wrapper distribution itself is pinned by
      # distributionSha256Sum in gradle-wrapper.properties.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a   # v4

      - name: Verify
        run: ./gradlew verify --no-daemon --stacktrace

      # A soak on a second seed. The seed controls the workload — amounts and transaction ids —
      # so this exercises figures the fixed default never reaches. It does not vary the thread
      # interleaving, which nothing here can promise to.
      - name: Verify on a second seed
        run: ./gradlew :lck:test --no-daemon -Plck.seed=8823714

      - name: Demo against both example ledgers
        run: ./gradlew demo --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: conformance-reports
          path: |
            lck/build/reports/lck/
            lck/build/reports/tests/
          retention-days: 14
