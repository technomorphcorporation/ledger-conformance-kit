# Publishes a signed release to the Sonatype Central Publisher Portal.
#
# Triggered by a tag, because a release should be a thing you can point at in history rather
# than a button someone pressed. The tag is the source of the version: v1.2.0 publishes 1.2.0.
#
# Deliberately staged, not automatic. publishingType=USER_MANAGED uploads the bundle and leaves
# it validated-but-unpublished in the Portal until a human presses Publish. Releasing to Central
# is irreversible — a version cannot be deleted or replaced once it is out — so the last step is
# a decision, not a side effect of pushing a tag. Change to AUTOMATIC only if you are certain.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (dry run only, never uploads)'
        required: true

permissions:
  contents: write        # to attach the bundle to the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false      # never interrupt a publish half-way

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c   # v5

      - name: Resolve the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            VERSION="${{ github.event.inputs.version }}"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi
          case "$VERSION" in
            *-SNAPSHOT) echo "::error::refusing to release a SNAPSHOT ($VERSION)"; exit 1 ;;
            ""|v*)      echo "::error::not a usable version: '$VERSION' (expected e.g. 1.0.0)"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      # Before verify, not after: a missing secret should cost five seconds, not the minute it
      # takes to run the suite first. The upload step already did this for its own credentials
      # and the build step did not, so an unset signing key surfaced as a Gradle "no configured
      # signatory" stack trace at step seven rather than as a sentence at step six.
      - name: Check the required secrets are present
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          missing=""
          [ -n "$SIGNING_KEY" ] || missing="$missing SIGNING_KEY"
          # SIGNING_PASSWORD is deliberately not required. A key generated without a passphrase
          # is a legitimate choice for a key that only ever lives in a secret store, and
          # demanding a value here would push someone into setting a dummy one — which fails at
          # signing with a passphrase mismatch, several steps later, for a reason the error does
          # not give. It must match the key: empty when the key has none.
          if [ "${{ steps.v.outputs.dry_run }}" = "false" ]; then
            [ -n "$CENTRAL_USERNAME" ] || missing="$missing CENTRAL_USERNAME"
            [ -n "$CENTRAL_PASSWORD" ] || missing="$missing CENTRAL_PASSWORD"
          fi
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            echo "A dry run still signs, so it needs the signing key even though it uploads"
            echo "nothing. See docs/releasing.md for the four one-time prerequisites:"
            echo "  1. claim the io.github.technomorphcorporation namespace on central.sonatype.com"
            echo "  2. generate a GPG key and publish the public half to a keyserver"
            echo "  3. generate Portal tokens"
            echo "  4. add SIGNING_KEY, SIGNING_PASSWORD, CENTRAL_USERNAME, CENTRAL_PASSWORD"
            exit 1
          fi
          # Shape, not just presence. Gradle's in-memory signing fails with "could not read PGP
          # secret key ring", which does not distinguish a truncated key from the wrong half of
          # the pair — and exporting the public key by mistake is the easiest thing in the world
          # to do, because the command differs by one word. The value is never echoed.
          case "$SIGNING_KEY" in
            *"BEGIN PGP PRIVATE KEY BLOCK"*) : ;;
            *"BEGIN PGP PUBLIC KEY BLOCK"*)
              echo "::error::SIGNING_KEY holds a PUBLIC key. Signing needs the private half:"
              echo "  gpg --armor --export-secret-keys <KEY_ID>     # not --export"
              exit 1 ;;
            *)
              echo "::error::SIGNING_KEY is not an ASCII-armored PGP block. It must include the"
              echo "BEGIN and END lines and every line between them, exactly as gpg printed it:"
              echo "  gpg --armor --export-secret-keys <KEY_ID>"
              exit 1 ;;
          esac
          case "$SIGNING_KEY" in
            *"END PGP PRIVATE KEY BLOCK"*) : ;;
            *) echo "::error::SIGNING_KEY has no END line — it was truncated when it was pasted"; exit 1 ;;
          esac

          # The one that gets everybody: newlines collapsed on the way into the secret. The
          # BEGIN and END markers both survive, so every substring check above still passes,
          # and the key is unparseable — which Gradle reports only as "could not read PGP
          # secret key". An armored private key is dozens of lines; one or two means the
          # line breaks are gone.
          lines=$(printf '%s\n' "$SIGNING_KEY" | wc -l | tr -d ' ')
          echo "SIGNING_KEY: $lines lines"        # a count is not the key
          if [ "$lines" -lt 10 ]; then
            echo "::error::SIGNING_KEY is $lines lines. An ASCII-armored private key is dozens."
            echo "The line breaks were lost when the secret was set. Set it from the file:"
            echo "  gpg --armor --export-secret-keys <KEY_ID> > /tmp/signing-key.asc"
            echo "  gh secret set SIGNING_KEY < /tmp/signing-key.asc"
            echo "  rm /tmp/signing-key.asc"
            echo "Pasting into the web UI also preserves them; passing --body \"\$(cat ...)\" may not."
            exit 1
          fi
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::notice::SIGNING_PASSWORD is empty — correct only if the key has no passphrase"
          fi
          echo "all required secrets are set, and SIGNING_KEY is an armored private key"

      # The gate runs before the release, not after it. An artifact that fails verify should
      # never reach a repository that cannot un-publish it.
      - name: Verify
        run: ./gradlew verify --no-daemon --stacktrace

      - name: Build the signed bundle
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew centralBundle --no-daemon -Pversion=${{ steps.v.outputs.version }}

      # Fail here rather than at the far end: a bundle missing a signature is rejected by the
      # Portal with a message that takes a while to interpret.
      - name: Check the bundle is complete
        run: |
          set -euo pipefail
          BUNDLE="build/distributions/central-bundle-${{ steps.v.outputs.version }}.zip"
          test -f "$BUNDLE" || { echo "::error::no bundle at $BUNDLE"; exit 1; }

          # -Z1 lists entry names only: no header, no totals, nothing to filter out.
          unzip -Z1 "$BUNDLE" > /tmp/entries.txt
          awk -F/ '{print $NF}' /tmp/entries.txt | sort -u > /tmp/names.txt
          echo "bundle contains $(wc -l < /tmp/entries.txt) files"
          test -s /tmp/entries.txt || { echo "::error::the bundle is empty"; exit 1; }

          # Every module publishes four artifacts. A missing javadoc jar is the one Central
          # rejects that nothing else would notice.
          for module in lck-spi lck lck-junit5; do
            for suffix in ".jar" "-sources.jar" "-javadoc.jar" ".pom"; do
              f="$module-${{ steps.v.outputs.version }}$suffix"
              grep -qxF "$f" /tmp/names.txt || { echo "::error::missing $f"; exit 1; }
            done
          done

          # Signature coverage, computed rather than assumed: anything that is not itself a
          # checksum or a signature must have a .asc beside it. This is how we find out whether
          # Gradle signs files we did not think about — the .module metadata, for one — here
          # rather than from a rejection at the far end.
          unsigned=""
          while read -r entry; do
            case "$entry" in *.md5|*.sha1|*.sha256|*.sha512|*.asc) continue ;; esac
            grep -qxF "$(basename "$entry").asc" /tmp/names.txt || unsigned="$unsigned $entry"
          done < /tmp/entries.txt
          if [ -n "$unsigned" ]; then
            echo "::error::unsigned files in the bundle:$unsigned"
            exit 1
          fi

          ! grep -q 'maven-metadata' /tmp/entries.txt \
            || { echo "::error::bundle contains maven-metadata, which the Portal rejects"; exit 1; }
          echo "every artifact present, every artifact signed, no metadata"


      - name: Upload to the Central Publisher Portal
        if: steps.v.outputs.dry_run == 'false'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$CENTRAL_USERNAME" && test -n "$CENTRAL_PASSWORD" \
            || { echo "::error::CENTRAL_USERNAME/CENTRAL_PASSWORD secrets are not set"; exit 1; }
          AUTH=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')

          DEPLOYMENT_ID=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $AUTH" \
            -F "bundle=@build/distributions/central-bundle-${VERSION}.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=ledger-conformance-kit-${VERSION}&publishingType=USER_MANAGED")

          echo "deployment: $DEPLOYMENT_ID"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Wait for validation
        if: steps.v.outputs.dry_run == 'false'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          AUTH=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')
          for attempt in $(seq 1 40); do
            STATE=$(curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $AUTH" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("deploymentState","UNKNOWN"))')
            echo "attempt $attempt: $STATE"
            case "$STATE" in
              VALIDATED|PUBLISHED)
                echo "::notice::$STATE — go to central.sonatype.com to publish it"
                exit 0 ;;
              FAILED)
                echo "::error::validation failed; see the deployment in the Portal"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::gave up waiting after 10 minutes; check the Portal"
          exit 1

      - name: Attach the bundle to the GitHub Release
        if: steps.v.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Signed bundle uploaded to the Central Publisher Portal, awaiting manual publish. Verified by the \`verify\` workflow before build." \
            "build/distributions/central-bundle-${{ steps.v.outputs.version }}.zip" \
            || gh release upload "${GITHUB_REF_NAME}" \
                 "build/distributions/central-bundle-${{ steps.v.outputs.version }}.zip" --clobber
