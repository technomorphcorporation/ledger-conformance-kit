# Every @Tag("docker") example, split out of `verify`: the Postgres pair, the live Formance run,
# and the TigerBeetle calibration run.
#
# It needs Docker and takes minutes, and verify runs on every push and pull request, where
# minutes are the difference between a check people wait for and one they learn to ignore.
#
# The cost of splitting it is stated rather than hidden: this is NOT a required check, so a
# pull request can merge and break it. That is the trade — a fast gate on every change, and
# this running on main straight after the merge, nightly, and on demand. If it goes red, it
# goes red on main within minutes of the commit that did it, with the commit named.
#
# One example per runner, deliberately. Run together on a single runner they compete for memory,
# and the loser is whichever wants the most: a TigerBeetle replica opens a gigabyte-scale data
# file and gets OOM-killed, which surfaces as a container that never becomes reachable rather
# than as anything mentioning memory. A runner each costs nothing — they run in parallel — and
# removes a whole class of failure that looks like a defect in the ledger under test.
name: examples

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'      # nightly, so a break surfaces even in a quiet week
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # One example failing must not cancel the others: when something environmental breaks, the
      # useful question is which of them survived it.
      fail-fast: false
      matrix:
        include:
          - name: postgres
            filter: "*PostgresConformanceTest*"
          - name: formance
            filter: "*FormanceConformanceTest*"
          - name: tigerbeetle
            filter: "*TigerBeetle*"

    name: ${{ matrix.name }}

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c   # v5

      - name: Show what the runner has to work with
        run: |
          echo "memory:"; free -h || true
          echo "disk:";   df -h / || true
          echo "docker:"; docker version --format '{{.Server.Version}}' || true

      - name: Run the ${{ matrix.name }} example
        run: ./gradlew dockerTest --tests '${{ matrix.filter }}' --no-daemon --stacktrace

      # A green tick is not evidence the example ran: without Docker these tests skip, and
      # skipping is correct on a contributor's laptop and meaningless here. The runner has
      # Docker, so on CI they must actually execute.
      - name: Assert the example actually ran
        run: |
          set -euo pipefail
          shopt -s nullglob
          REPORTS=(lck/build/test-results/dockerTest/*.xml)
          test ${#REPORTS[@]} -gt 0 || { echo "::error::no test report — nothing ran at all"; exit 1; }
          python3 - "${REPORTS[@]}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          total = skipped = failures = 0
          for path in sys.argv[1:]:
              r = ET.parse(path).getroot()
              total    += int(r.get('tests', 0))
              skipped  += int(r.get('skipped', 0))
              failures += int(r.get('failures', 0)) + int(r.get('errors', 0))
          print(f"tests={total} skipped={skipped} failures={failures}")
          if total == 0:
              sys.exit("::error::the reports contain no tests")
          if skipped == total:
              sys.exit("::error::every test skipped — Docker was unavailable on a runner that "
                       "has it, so this run verified nothing despite passing")
          PY

      # The container's own output is the only thing that distinguishes "blocked by seccomp" from
      # "killed for memory" from "genuinely broken", and both look identical from outside.
      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}}' || true
          for c in $(docker ps -aq); do
            echo "::group::$c"
            docker inspect "$c" --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} err={{.State.Error}}' || true
            docker logs --tail 40 "$c" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4   # v5
        with:
          name: ${{ matrix.name }}-conformance
          path: |
            lck/build/reports/lck/
            lck/build/test-results/dockerTest/
          retention-days: 30
